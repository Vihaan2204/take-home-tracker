<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A7C52"><title>Take-Home Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&family=Anek+Latin:wdth,wght@75..125,100..800&family=Anek+Telugu:wdth,wght@75..125,100..800&family=Special+Elite&display=swap">
<style>
/* Bahi-khata redesign: warm paper, ink, stamps, ruled lines. One narrow column, hero number first. */
:root{
  --paper:#FBF6EC; --paper-deep:#F3EAD7; --ink:#1F2340; --ink-soft:#5A5F7A; --rule:#E2D6BE;
  --khata-red:#7B2D5B; --haldi:#E3A321; --profit:#1E7A4C; --loss:#C2410C; --loss-text:#A8360A; --on-red:#FFFFFF;
  --s1:#7B2D5B; --s2:#E3A321; --s3:#2F5D8A; --s4:#6B8E23; --s5:#A8231C; --s6:#3E7C7B;
  --shadow:0 1px 0 var(--rule),0 6px 16px rgba(31,35,64,0.06);
  --action:var(--khata-red); --btn:var(--khata-red); --on-btn:#FFFFFF;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.04'/></svg>");
  --grain-dark:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 .95  0 0 0 0 .78  0 0 0 0 .55  0 0 0 1.8 -.35'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.04'/></svg>");
  --sans:'Anek Latin',system-ui,'Noto Sans Telugu','Noto Sans Devanagari',sans-serif;
  --stamp:'Special Elite','Courier New',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root:lang(te){--sans:'Anek Telugu',system-ui,'Noto Sans Telugu',sans-serif}
:root:lang(hi){--sans:'Anek Devanagari',system-ui,'Noto Sans Devanagari',sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1311; --paper-deep:#251B17; --ink:#F3E6D0; --ink-soft:#B8A58C; --rule:#3D2D25;
    --khata-red:#D9483B; --haldi:#F0B23A; --profit:#6CC08B; --loss:#F08A5D; --loss-text:#F08A5D;
    --action:#F0B23A; --btn:#F0B23A; --on-btn:#1A1311; --grain:var(--grain-dark);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1311; --paper-deep:#251B17; --ink:#F3E6D0; --ink-soft:#B8A58C; --rule:#3D2D25;
    --khata-red:#D9483B; --haldi:#F0B23A; --profit:#6CC08B; --loss:#F08A5D; --loss-text:#F08A5D;
    --action:#F0B23A; --btn:#F0B23A; --on-btn:#1A1311; --grain:var(--grain-dark);
    --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.5;
  background:var(--grain) 0 0/180px 180px, var(--paper);
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
:root:lang(te) body,:root:lang(hi) body{line-height:1.7}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:8px;z-index:20;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(251,246,236,.55) 0 6px,transparent 6px 11px) 0 3px/100% 1px no-repeat var(--khata-red)}
.wrap{max-width:480px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 0 6px}
h1{font-family:var(--sans);font-weight:700;font-size:24px;line-height:1.2;margin:0;letter-spacing:-0.01em}
.tag{color:var(--ink-soft);font-size:14px;margin:0 0 8px;line-height:1.5}
.lang{display:flex;gap:2px;background:var(--paper-deep);border:1.5px solid var(--rule);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;color:var(--ink-soft);font:600 14px/1 var(--sans);min-width:44px;min-height:44px;border-radius:999px;cursor:pointer;transition:background-color .15s var(--ease),color .15s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.banner{position:sticky;top:12px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--haldi);color:#1F2340;border-radius:10px 10px 4px 4px;padding:10px 12px 14px;margin:8px 0;font-size:14px;font-weight:600;line-height:1.4}
.banner::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0 0 4px 4px;background:repeating-linear-gradient(45deg,#1F2340 0 5px,transparent 5px 10px);opacity:.55}
.banner button{border:1.5px solid #1F2340;background:transparent;color:#1F2340;border-radius:10px;padding:0 12px;font:600 13px var(--sans);cursor:pointer;min-height:48px}
.view{display:flex;flex-direction:column;gap:16px;padding-top:24px}
.card,.hero,.stmt{position:relative;background:var(--paper-deep);border:1.5px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card:has(>h2:first-child){margin-top:20px}
.card>h2:first-child{position:absolute;left:14px;bottom:calc(100% - 1.5px);max-width:calc(100% - 28px);margin:0;padding:6px 14px 5px;background:var(--paper-deep);border:1.5px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;font-size:18px;line-height:1.3}
h2{font-family:var(--sans);font-weight:700;font-size:18px;line-height:1.3;margin:0 0 12px}
h2 svg,.btn svg,label svg,.ico svg{vertical-align:-4px}
h2 svg{width:20px;height:20px;margin-right:6px}
h2.grp{margin:14px 0 2px}
label,.lbl{display:block;font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px}
:root:lang(en) label:not(.srcl),:root:lang(en) .hlabel,:root:lang(en) .hero .small,:root:lang(en) .stat .k{text-transform:uppercase;letter-spacing:.08em}
label svg{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.hint{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
input[type=number],input[type=date],input[type=month],input[type=text],input[type=password],select,textarea{
  width:100%;min-height:52px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper-deep);color:var(--ink);
  font:500 18px/1.3 var(--sans);padding:8px 14px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(31,35,64,.05);transition:border-color .15s var(--ease)
}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
textarea{font-size:16px;min-height:96px;resize:vertical}
select{font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--haldi);box-shadow:0 0 0 .5px var(--haldi)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.grid2>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.rs{position:relative}
.rs span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-weight:600;font-size:15px;pointer-events:none}
.rs input{padding-right:46px}
label.srcl{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:36px;padding:5px 14px 5px 12px;border:1.5px solid var(--rule);border-radius:999px;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;margin-bottom:8px;text-transform:none;letter-spacing:0;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
label.srcl i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
label.srcl.on{background:color-mix(in srgb,var(--c) 15%,transparent);border-color:var(--c)}
/* hero result panel */
.hero{padding:20px 20px 20px}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hlabel,.hero .small{font-size:13px;font-weight:600;line-height:1.4;color:var(--ink-soft)}
.hbig,.hero .big{font-family:var(--sans);font-weight:800;font-stretch:75%;font-variation-settings:'wdth' 75;font-size:clamp(40px,14vw,56px);line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;margin:8px 0 0;overflow-wrap:anywhere}
.hero.loss .hbig,.hero.loss .big{color:var(--loss-text)}
svg.brush{display:block;width:min(100%,260px);height:12px;margin:4px 0 14px;overflow:visible}
svg.brush path{fill:none;stroke:var(--haldi);stroke-linecap:round}
.hero .row{display:flex;gap:6px 18px;flex-wrap:wrap;font-weight:600;font-variant-numeric:tabular-nums}
.verdict{margin:12px 0 0;font-size:17px;font-weight:600;line-height:1.5}
.hero .verdict{margin-top:0}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--ink-soft);vertical-align:1px}
.sd.good{background:var(--profit)} .sd.mid{background:var(--haldi)} .sd.bad{background:var(--loss)}
.tiles{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tile{flex:1 1 92px;min-width:0;background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:10px 10px 8px;font-variant-numeric:tabular-nums}
.stat:has(>.v:empty){display:none}
.tile b{display:inline-block;font-size:clamp(17px,5.4vw,22px);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile>span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.4}
.dbl{padding-bottom:6px;background:linear-gradient(var(--ink),var(--ink)) 0 calc(100% - 4px)/100% 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 100%/100% 1px no-repeat}
.cur{font-size:.6em;vertical-align:.5em;font-weight:inherit;margin-right:1px;line-height:0}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
.table td,.table th{padding:10px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;line-height:1.4}
.table td:last-child,.table th:last-child{text-align:right;white-space:nowrap}
.table tr:last-child td{border-bottom:0}
.table .tot td{font-weight:700}
.table .tot td:last-child{padding-bottom:12px;border-bottom:0;background:linear-gradient(var(--ink),var(--ink)) 0 calc(100% - 6px)/100% 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 calc(100% - 3px)/100% 1px no-repeat}
.scroll{overflow-x:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;border:1.5px solid var(--btn);background:var(--btn);color:var(--on-btn);font:700 17px/1.25 var(--sans);cursor:pointer;text-decoration:none;text-align:center;transition:transform .15s var(--ease),background-color .15s var(--ease)}
.btn:active{transform:translateY(1px);background:color-mix(in srgb,var(--btn) 80%,#000);border-color:color-mix(in srgb,var(--btn) 80%,#000)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.ghost:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.danger{background:transparent;color:var(--loss-text);border-color:var(--loss)}
.btn.wa{background:#25D366;border-color:#25D366;color:#10301E}
.btn.small{min-height:48px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.txt{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0;border:0;background:none;color:var(--action);font:700 16px/1.2 var(--sans);cursor:pointer;text-decoration:none;align-self:flex-start}
.txt:hover,.txt:active{text-decoration:underline wavy var(--haldi);text-decoration-thickness:2px;text-underline-offset:6px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions>*{flex:1 1 140px}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--paper-deep);border:1.5px solid var(--rule);border-radius:999px;padding:4px}
.seg::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));border-radius:999px;background:var(--ink);transform:translateX(calc(var(--i,0)*100%));transition:transform .2s var(--ease)}
.seg button{position:relative;z-index:1;min-height:48px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 15px/1.2 var(--sans);cursor:pointer;padding:0 8px;transition:color .2s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--paper)}
.choice{display:flex;flex-direction:column;gap:12px}
.choice button{min-height:64px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font:700 17px/1.3 var(--sans);cursor:pointer;text-align:left;padding:10px 16px;display:flex;flex-direction:row;align-items:center;gap:14px;transition:border-color .15s var(--ease),transform .15s var(--ease)}
.choice button:active{transform:translateY(1px)}
.choice button .wtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice button small{font:400 14px/1.4 var(--sans);color:var(--ink-soft)}
.choice button svg{flex:none}
.choice button:hover{border-color:var(--khata-red)}
.wi{display:inline-flex;flex:none;color:var(--khata-red)}
.wi svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.stat .k{font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.4}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.bar{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden;background:var(--paper);margin:8px 0 12px}
.bar i{display:block;height:100%;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;font-variant-numeric:tabular-nums}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{text-align:center;color:var(--ink-soft);padding:28px 16px}
.empty .btn{margin-top:12px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums}
.c-ink{fill:var(--ink)} .c-muted{fill:var(--ink-soft)} .c-pos{fill:var(--profit)} .c-neg{fill:var(--loss)} .c-line{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 4}
.stmt{border-style:dashed}
.stmt h3{font-size:18px;font-weight:700;margin:0 0 2px}
.note{font-size:14px;color:var(--ink-soft);margin:12px 0 0}
.srcrow{display:flex;gap:8px;align-items:center}
.srcrow input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:48px;border-radius:999px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font:600 14px var(--sans);padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button svg{width:16px;height:16px}
.min{font-weight:800;font-size:40px;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.card.list{padding-top:12px;padding-bottom:12px}
.card.list>*:not(h2:first-child){margin-left:0}
.due{display:flex;flex-direction:column;gap:8px;min-height:64px;padding:14px 0;border-bottom:1px solid var(--rule)}
.card.list>.due:last-child{border-bottom:0}
.due.late{border-left:4px solid var(--loss);padding-left:12px;margin-left:-20px;padding-right:0}
.due.late{margin-left:-20px;padding-left:16px}
.due .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.due .who{font-weight:700;overflow-wrap:anywhere}
.due .amt{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:2px 12px;border:1.5px solid var(--rule);color:var(--ink-soft)}
.stamp{display:inline-block;font-family:var(--stamp);font-size:15px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--khata-red);border:2px solid var(--khata-red);border-radius:4px;padding:3px 10px;transform:rotate(-6deg);opacity:.85;filter:url(#rough2);white-space:nowrap}
.stamp svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.stamp.small{font-size:12px;padding:1px 8px;border-width:1.5px;transform:rotate(-3deg);color:var(--loss-text);border-color:var(--loss)}
.stamp.thump{animation:thump .15s var(--ease)}
@keyframes thump{from{transform:rotate(-6deg) scale(1.3);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:.85}}
.prog{position:relative;height:12px;border-radius:999px;background:var(--rule);margin:32px 0 10px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--haldi)}
.ptag{position:absolute;top:-30px;transform:translateX(-50%) rotate(-4deg);font-family:var(--stamp);font-style:normal;font-size:13px;line-height:1;padding:4px 8px;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;color:var(--ink)}
details.tip{border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;padding:0}
details.tip:last-of-type{border-bottom:0}
details.tip summary{min-height:64px;display:flex;align-items:center;cursor:pointer;font-weight:700;list-style:none;padding:8px 0;line-height:1.4}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:'+';margin-left:auto;padding-left:12px;font-size:24px;color:var(--action);font-weight:600}
details.tip[open] summary::after{content:'\2212'}
details.tip p{margin:0 0 14px;color:var(--ink-soft);font-size:16px}
details.tip a{color:var(--action);font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:48px}
details.tip a svg{width:16px;height:16px}
.card>details.tip{margin:0 0 -1px}
/* ledger log card */
.ledger{padding-left:40px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,color-mix(in srgb,var(--rule) 70%,transparent) 31px 32px);background-position:0 12px}
.ledger::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--khata-red)}
.nudge{border:1.5px dashed var(--khata-red);box-shadow:none;display:flex;flex-direction:column;gap:8px}
.nudge .actions>*{flex:0 1 auto}
.ico{display:inline-flex}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper-deep);border-top:1.5px solid var(--rule);height:calc(64px + env(safe-area-inset-bottom, 0px));padding:0 8px env(safe-area-inset-bottom, 0px);z-index:10}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--ink-soft);font:600 12px/1.1 var(--sans);cursor:pointer;padding:0 2px;transition:color .15s var(--ease)}
nav.tabs button span{max-width:100%;overflow-wrap:anywhere;text-align:center}
nav.tabs button[aria-current="page"]{color:var(--action)}
nav.tabs button[aria-current="page"]::before{content:'';position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--haldi);border-radius:0 0 3px 3px}
nav.tabs button[aria-current="page"] .f{fill:var(--haldi)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;line-height:1.4;z-index:30;max-width:calc(100vw - 32px)}
/* PIN lock */
.lock{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px 24px;overflow:auto}
.lockin{width:100%;max-width:320px;text-align:center}
.lockin h2{display:flex;align-items:center;justify-content:center;gap:8px}
.dots{display:flex;justify-content:center;gap:16px;margin:16px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);display:block;transition:background-color .15s var(--ease)}
.dots i.on{background:var(--khata-red);border-color:var(--khata-red)}

 tip1t:'మీ నిజమైన గంట వేతనం తెలుసుకోండి', tip1:'సంపాదన అంటే లాభం కాదు. ఇంధనం, సామగ్రి, ఫీజులు, అద్దె లేదా EMI వాటాను తీసివేసి, పని చేసిన గంటలతో భాగించండి. అదే మీ నిజమైన గంట వేతనం.',

 tip6t:'జాగ్రత్తగా అప్పు తీసుకోండి', tip6:'అప్పు తీసుకునే ముందు, నెలవారీ EMI మాత్రమే కాకుండా మొత్తం తిరిగి చెల్లించాల్సిన మొత్తం అడగండి. బ్యాంక్, సహకార లేదా మైక్రోఫైనాన్స్ సంస్థ, లోన్ యాప్‌ల వడ్డీ రేట్లను పోల్చండి. PM ముద్ర యోజన వంటి చిన్న వ్యాపార పథకాలు ఉన్నాయి, మీ బ్యాంక్‌ను అడగండి.',

on Service Centre for unorganised and gig workers aged 16 to 59 who are not in EPFO or ESIC. You get a card and number that link you to government benefits, and accident cover has been offered with registration. Check current terms.', g2t:'Accident and life insurance for rupees a year', g2:'PM Suraksha Bima Yojana gives accident cover of ₹2 lakh for about ₹20 a year. PM Jeevan Jyoti Bima Yojana gives ₹2 lakh life cover for about ₹436 a year. Both are paid by auto-debit from a bank account. Age limits apply.', g3t:'Health cover: Ayushman Bharat and Aarogyasri', g3:'PM-JAY gives free hospital treatment up to ₹5 lakh per family per year to eligible families (pmjay.gov.in, helpline 14555). Telangana\'s Aarogyasri covers up to ₹10 lakh per family per year, but private hospitals have paused services over unpaid dues before, so confirm that your hospital accepts it. The government has announced PM-JAY cover for registered gig workers, but I could not confirm that it has started, so ask on e-Shram or at a Common Service Centre.', g4t:'Pension: Atal Pension Yojana', g4:'Join between ages 18 and 40 through your bank to get a fixed pension of ₹1,000 to ₹5,000 a month from age 60. The monthly amount you pay depends on your age and the pension you choose.', g5t:'Business loans: Mudra', g5:'PM Mudra Yojana gives collateral-free loans for small non-farm businesses. Shishu is up to ₹50,000, Kishore up to ₹5 lakh and Tarun up to ₹10 lakh. Tarun Plus, up to ₹20 lakh, is for those who have already repaid a Tarun loan. Apply at a bank, cooperative or microfinance lender (mudra.org.in).', g6t:'Street vendors: PM SVANidhi', g6:'Small collateral-free working-capital loans in stages for street vendors: ₹15,000, then ₹25,000, then ₹50,000 as you repay on time. Digital payments can earn cashback, and a UPI-linked RuPay credit card is offered after the second loan. The scheme runs until March 2030 (pmsvanidhi.mohua.gov.in). Check the current terms.', g7t:'Artisans and tailors: PM Vishwakarma', g7:'For people in listed traditional trades such as tailors and barbers. It offers an ID card, skill training with a daily stipend, a toolkit grant and low-interest loans (pmvishwakarma.gov.in).', g8t:'For women entrepreneurs', g8:'Stand-Up India gives loans of ₹10 lakh to ₹1 crore to women and SC/ST first-time entrepreneurs (standupmitra.in). Self-help groups (SHGs) give women low-interest group loans. WE Hub is a Telangana government incubator in Hyderabad for women-led startups, so it suits growth-minded businesses more than a one-person service.', g9t:'Udyam registration', g9:'Free registration as a micro enterprise at udyamregistration.gov.in. It helps you get bank loans and scheme benefits. Do not pay agents, because the official site is free.', g10t:'Gig worker rights', g10:'India\'s Code on Social Security came into force on 21 November 2025 and recognises gig and platform workers. Platforms must contribute 1 to 2 percent of their turnover to a social security fund. Workers aged 16 and above register on e-Shram, and benefits usually need about 90 days of work with one platform or 120 days across several in a year. Telangana has also drafted its own gig workers law, so ask the state labour department what applies to you.', g11t:'Jan Dhan account', g11:'A zero-balance bank account with a RuPay card that includes accident cover. It is also where government payments reach you directly.', n6t:'Fake schemes and registration-fee calls', n6:'Government schemes never charge you to register or ask for a fee to release a loan. Use only websites ending in gov.in, and visit a bank or Common Service Centre if unsure.', n7t:'Never pay to receive money', n7:'You enter a UPI PIN only to send money, never to receive it. A "collect request" or a message asking for your PIN to get a refund or prize is a scam. Report fraud at cybercrime.gov.in or call 1930.' },

 onbVehicleS:'స్విగ్గీ, జొమాటో, బ్లింకిట్, ఉబర్, రాపిడో, ఓలా, మీ సొంత ఆటో లేదా క్యాబ్', onbServiceS:'బ్యూటీ, టైలరింగ్, రిపేర్లు, క్లీనింగ్, వంట, ఇంటికి వెళ్లి చేసే సేవలు', onbOnlineS:'ఫ్రీలాన్సింగ్, డిజైన్, రచన, ట్యూషన్, డేటా ఎంట్రీ, కంటెంట్', onbOtherS:'దుకాణం, బండి, ఇంట్లో వంట, హస్తకళలు, రీసేల్ లేదా ఏదైనా ఇతర పని', learnTitle:'డబ్బు మరియు సహాయ గైడ్', learnIntro:'సులభమైన భాషలో డబ్బు ప్రాథమికాలు, మీరు పొందగలిగే ప్రభుత్వ సహాయం.', learnNote:'ఇది సాధారణ సమాచారం మాత్రమే, రాసిన సమయంలో తెలిసిన నియమాల ఆధారంగా. మొత్తాలు, అర్హతలు మారవచ్చు. దరఖాస్తు చేసే ముందు అధికారిక వెబ్‌సైట్‌లో లేదా బ్యాంక్ లేదా కామన్ సర్వీస్ సెంటర్‌లో నిర్ధారించుకోండి. ఇది ఆర్థిక సలహా కాదు.', grp1:'మీ లెక్కలు తెలుసుకోండి', grp2:'పొదుపు మరియు అప్పు', grp3:'కొన్ని ప్రభుత్వ పథకాలు', grp4:'సురక్షితంగా ఉండండి', n1t:'రిపేర్లు, రెన్యువల్స్ కోసం డబ్బు పక్కన పెట్టండి', n1:'సర్వీసింగ్, టైర్లు, పనిముట్లు, పరికరాలు లేదా సరుకు కోసం ప్రతి పని రోజూ కొంచెం పక్కన పెట్టండి. ఒకేసారి వచ్చే ఖర్చులే మంచి నెలను చెడ్డ నెలగా మారుస్తాయి.', n5t:'పెద్ద ఆర్డర్లకు అడ్వాన్స్ తీసుకోండి', n5:'కుట్టు పని, ఈవెంట్లు లేదా ప్రత్యేక ఆర్డర్లకు 30 నుండి 50 శాతం ముందే అడగండి. ఇది సామగ్రి ఖర్చును కవర్ చేస్తుంది, డబ్బు రాకపోయే ప్రమాదాన్ని తగ్గిస్తుంది. మిగతా మొత్తాన్ని బాకీలు ట్యాబ్‌లో నమోదు చేయండి.', n2t:'మీ క్రెడిట్ స్కోర్ తెలుసుకోండి', n2:'EMIలు, కార్డ్ బిల్లులు సమయానికి కట్టండి. మీకు అప్పు వస్తుందా, ఏ వడ్డీకి వస్తుందా అన్నది క్రెడిట్ (CIBIL) స్కోర్ నిర్ణయిస్తుంది. ప్రతి క్రెడిట్ బ్యూరో నుండి సంవత్సరానికి ఒకసారి పూర్తి క్రెడిట్ రిపోర్ట్ ఉచితంగా పొందవచ్చు.', n3t:'నమోదిత రుణదాతల నుండే అప్పు తీసుకోండి', n3:'అప్పు తీసుకునే ముందు ఆ బ్యాంక్ లేదా NBFC RBI జాబితాలో ఉందో లేదో చూడండి. మీ కాంటాక్ట్స్ లేదా ఫోటోలు అడిగే, లేదా బెదిరించే లోన్ యాప్‌లు ప్రమాద సంకేతం. cybercrime.gov.inలో లేదా 1930కి ఫిర్యాదు చేయండి.', n4t:'ఆదాయపు పన్ను రిటర్న్ దాఖలు చేయండి', n4:'పన్ను కట్టాల్సిన అవసరం లేకపోయినా, రిటర్న్ ఆదాయానికి రుజువు, అప్పులు, వీసా, అద్దె ఇళ్లకు ఉపయోగపడుతుంది. ఫ్రీలాన్సర్లు, చిన్న వ్యాపారులు సులభమైన ప్రిజంప్టివ్ పన్ను పథకాలు (సెక్షన్ 44ADA, 44AD) వాడవచ్చు. నియమాలు మారుతాయి కాబట్టి పన్ను నిపుణుడిని అడగండి.', g1t:'ఈ-శ్రమ్ కార్డ్', g1:'EPFO లేదా ESICలో లేని, 16 నుండి 59 ఏళ్ల అసంఘటిత, గిగ్ కార్మికులకు eshram.gov.in లేదా ఏదైనా కామన్ సర్వీస్ సెంటర్‌లో ఉచిత నమోదు. ప్రభుత్వ ప్రయోజనాలకు అనుసంధానమయ్యే కార్డ్, నంబర్ వస్తాయి. నమోదుతో పాటు ప్రమాద బీమా అందించారు. ప్రస్తుత నిబంధనలు చూడండి.', g2t:'సంవత్సరానికి కొన్ని రూపాయలకే ప్రమాద, జీవిత బీమా', g2:'ప్రధానమంత్రి సురక్ష బీమా యోజన సుమారు ₹20 సంవత్సరానికి ₹2 లక్షల ప్రమాద బీమా ఇస్తుంది. ప్రధానమంత్రి జీవన్ జ్యోతి బీమా యోజన సుమారు ₹436 సంవత్సరానికి ₹2 లక్షల జీవిత బీమా ఇస్తుంది. రెండూ బ్యాంక్ ఖాతా నుండి ఆటో-డెబిట్ అవుతాయి. వయోపరిమితులు ఉన్నాయి.', g3t:'ఆరోగ్య బీమా: ఆయుష్మాన్ భారత్, ఆరోగ్యశ్రీ', g3:'అర్హత ఉన్న కుటుంబాలకు PM-JAY సంవత్సరానికి ₹5 లక్షల వరకు ఉచిత ఆసుపత్రి చికిత్స ఇస్తుంది (pmjay.gov.in, హెల్ప్‌లైన్ 14555). తెలంగాణ ఆరోగ్యశ్రీ కుటుంబానికి సంవత్సరానికి ₹10 లక్షల వరకు కవర్ చేస్తుంది, కానీ బకాయిల కారణంగా ప్రైవేట్ ఆసుపత్రులు గతంలో సేవలు ఆపాయి, కాబట్టి మీ ఆసుపత్రి దీన్ని అంగీకరిస్తుందో నిర్ధారించుకోండి. నమోదైన గిగ్ కార్మికులకు PM-JAY కవరేజీని ప్రభుత్వం ప్రకటించింది, కానీ అది మొదలైందని నేను నిర్ధారించలేకపోయాను, కాబట్టి ఈ-శ్రమ్‌లో లేదా కామన్ సర్వీస్ సెంటర్‌లో అడగండి.', g4t:'పెన్షన్: అటల్ పెన్షన్ యోజన', g4:'18 నుండి 40 ఏళ్ల మధ్య బ్యాంక్ ద్వారా చేరితే 60 ఏళ్ల నుండి నెలకు ₹1,000 నుండి ₹5,000 స్థిర పెన్షన్ వస్తుంది. మీరు కట్టే నెలవారీ మొత్తం మీ వయసు, ఎంచుకున్న పెన్షన్‌పై ఆధారపడి ఉంటుంది.', g5t:'వ్యాపార రుణాలు: ముద్ర', g5:'PM ముద్ర యోజన చిన్న వ్యవసాయేతర వ్యాపారాలకు పూచీకత్తు లేని రుణాలు ఇస్తుంది. శిశు ₹50,000 వరకు, కిశోర్ ₹5 లక్షల వరకు, తరుణ్ ₹10 లక్షల వరకు. తరుణ్ రుణం ఇప్పటికే తీర్చినవారికి తరుణ్ ప్లస్ (₹20 లక్షల వరకు). బ్యాంక్, సహకార సంస్థ లేదా మైక్రోఫైనాన్స్ సంస్థలో దరఖాస్తు చేయండి (mudra.org.in).', g6t:'వీధి వ్యాపారులు: PM స్వనిధి', g6:'వీధి వ్యాపారులకు దశలవారీగా పూచీకత్తు లేని చిన్న వర్కింగ్ క్యాపిటల్ రుణాలు: సమయానికి చెల్లిస్తే ₹15,000, తర్వాత ₹25,000, ఆపై ₹50,000. డిజిటల్ చెల్లింపులకు క్యాష్‌బ్యాక్ రావచ్చు, రెండో రుణం తర్వాత UPI అనుసంధానమైన రూపే క్రెడిట్ కార్డ్ ఇస్తారు. ఈ పథకం మార్చి 2030 వరకు ఉంది (pmsvanidhi.mohua.gov.in). ప్రస్తుత నిబంధనలు చూడండి.', g7t:'చేతివృత్తులవారు, టైలర్లు: PM విశ్వకర్మ', g7:'టైలర్లు, క్షురకులు వంటి జాబితాలోని సంప్రదాయ వృత్తులవారి కోసం. గుర్తింపు కార్డ్, రోజువారీ స్టైపెండ్‌తో నైపుణ్య శిక్షణ, పనిముట్ల గ్రాంట్, తక్కువ వడ్డీ రుణాలు అందిస్తుంది (pmvishwakarma.gov.in).', g8t:'మహిళా వ్యవస్థాపకుల కోసం', g8:'స్టాండ్-అప్ ఇండియా మహిళలు, SC/ST తొలి వ్యవస్థాపకులకు ₹10 లక్షల నుండి ₹1 కోటి వరకు రుణాలు ఇస్తుంది (standupmitra.in). స్వయం సహాయక సంఘాలు (SHG) మహిళలకు తక్కువ వడ్డీ గ్రూప్ రుణాలు ఇస్తాయి. WE Hub అనేది హైదరాబాద్‌లో మహిళలు నడిపే స్టార్టప్‌ల కోసం తెలంగాణ ప్రభుత్వ ఇంక్యుబేటర్, కాబట్టి ఒక్కరే చేసే సేవ కంటే వృద్ధి కోరుకునే వ్యాపారాలకు ఎక్కువ సరిపోతుంది.', g9t:'ఉద్యమ్ నమోదు', g9:'udyamregistration.gov.inలో సూక్ష్మ సంస్థగా ఉచిత నమోదు. ఇది బ్యాంక్ రుణాలు, పథకాల ప్రయోజనాలు పొందడానికి సహాయపడుతుంది. ఏజెంట్లకు డబ్బు ఇవ్వకండి, ఎందుకంటే అధికారిక సైట్ ఉచితం.', g10t:'గిగ్ కార్మికుల హక్కులు', g10:'సామాజిక భద్రతా కోడ్ 21 నవంబర్ 2025 నుండి అమల్లోకి వచ్చింది, గిగ్, ప్లాట్‌ఫారమ్ కార్మికులను గుర్తిస్తుంది. ప్లాట్‌ఫారమ్‌లు తమ టర్నోవర్‌లో 1 నుండి 2 శాతం సామాజిక భద్రతా నిధికి జమ చేయాలి. 16 ఏళ్లు పైబడిన కార్మికులు ఈ-శ్రమ్‌లో నమోదు చేసుకోవాలి, ప్రయోజనాలకు సాధారణంగా సంవత్సరంలో ఒక ప్లాట్‌ఫారమ్‌లో సుమారు 90 రోజులు లేదా పలు ప్లాట్‌ఫారమ్‌లలో 120 రోజులు పని అవసరం. తెలంగాణ కూడా సొంత గిగ్ కార్మికుల చట్టం ముసాయిదా రూపొందించింది, మీకు ఏది వర్తిస్తుందో రాష్ట్ర కార్మిక శాఖను అడగండి.', g11t:'జన్ ధన్ ఖాతా', g11:'ప్రమాద బీమా ఉన్న రూపే కార్డ్‌తో జీరో బ్యాలెన్స్ బ్యాంక్ ఖాతా. ప్రభుత్వ చెల్లింపులు నేరుగా మీకు చేరేది కూడా ఇక్కడికే.', n6t:'నకిలీ పథకాలు, నమోదు రుసుము కాల్స్', n6:'ప్రభుత్వ పథకాలు నమోదుకు డబ్బు తీసుకోవు, రుణం ఇవ్వడానికి రుసుము అడగవు. gov.inతో ముగిసే వెబ్‌సైట్‌లనే వాడండి, సందేహం ఉంటే బ్యాంక్ లేదా కామన్ సర్వీస్ సెంటర్‌కు వెళ్లండి.', n7t:'డబ్బు అందుకోవడానికి ఎప్పుడూ చెల్లించకండి', n7:'డబ్బు పంపడానికి మాత్రమే UPI PIN నమోదు చేస్తారు, అందుకోవడానికి ఎప్పుడూ కాదు. "కలెక్ట్ రిక్వెస్ట్", లేదా రీఫండ్ లేదా బహుమతి కోసం PIN అడిగే సందేశం మోసం. మోసాన్ని cybercrime.gov.inలో లేదా 1930కి తెలియజేయండి.' },

      return /₹(?=\d)/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
    var nodes = [], n; while((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function(tn){
      var parts = tn.nodeValue.split(/(₹(?=\d))/), f = document.createDocumentFragment();
      parts.forEach(function(part){ if(part==='₹'){ var sp = document.createElement('span'); sp.className = 'cur'; sp.textContent = '₹'; f.appendChild(sp); } else if(part) f.appendChild(document.createTextNode(part)); });

function parseVoice(txt){
  var res = {apps:{}, hours:0, km:0, jobs:0}, x = String(txt||'').toLowerCase().replace(/(\d),(\d)/g,'$1$2'), re = /(\d+(?:\.\d+)?)/g, m, last = 0;

  if(!names.some(function(n){ return n.id==='cash'; })) {}
  while((m = re.exec(x))){
    var val = parseFloat(m[1]), after = x.slice(m.index+m[0].length, m.index+m[0].length+16), before = x.slice(last, m.index);
    last = m.index + m[0].length;

    else if(VOICE_UNITS.jobs.test(after)) res.jobs = val;

function chart14(list){
  var map = {}, offs = {}; list.forEach(function(x){ map[x.date] = x.e.off ? 0 : x.r.net; if(x.e.off) offs[x.date] = 1; });
  var days = []; for(var i=13;i>=0;i--){ days.push(ymd(addDays(new Date(), -i))); }
  var vals = days.map(function(d){ return map.hasOwnProperty(d) ? map[d] : null; });
  var present = vals.filter(function(x){ return x!==null; });
  if(!present.length) return '<p class="hint">'+esc(t('noData'))+'</p>';
  var maxV = Math.max.apply(null, present), minV = Math.min.apply(null, present);
  var hi = Math.max(0, maxV), lo = Math.min(0, minV); if(hi===lo) hi = lo+1;
  var W=336, top=22, bot=118, slot=W/14, bw=20;
  function y(v){ return top + (hi-v)/(hi-lo)*(bot-top); }
  var s = '<svg class="chart" viewBox="0 0 '+W+' 146" role="img" aria-label="'+esc(t('last14'))+'"><line class="c-line" x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  vals.forEach(function(v, i){
    var x = i*slot + (slot-bw)/2;
    if(v!==null && offs[days[i]]){ s += '<path d="M'+(x+4).toFixed(1)+' '+y(0).toFixed(1)+'h'+(bw-8)+'" stroke="var(--ink-soft)" stroke-width="3" stroke-linecap="round" fill="none"/>'; }
    else if(v!==null){
      var y1 = y(Math.max(v,0)), y2 = y(Math.min(v,0)), h = Math.max(1.5, y2-y1);
      var rr = Math.min(8, bw/2, h), X = x, Y = y1, H = h, B = bw;
      if(v>=0) s += '<path class="c-pos" d="M'+X.toFixed(1)+' '+(Y+H).toFixed(1)+'V'+(Y+rr).toFixed(1)+'Q'+X.toFixed(1)+' '+Y.toFixed(1)+' '+(X+rr).toFixed(1)+' '+Y.toFixed(1)+'H'+(X+B-rr).toFixed(1)+'Q'+(X+B).toFixed(1)+' '+Y.toFixed(1)+' '+(X+B).toFixed(1)+' '+(Y+rr).toFixed(1)+'V'+(Y+H).toFixed(1)+'Z"/>';
      else s += '<path class="c-neg" d="M'+X.toFixed(1)+' '+Y.toFixed(1)+'V'+(Y+H-rr).toFixed(1)+'Q'+X.toFixed(1)+' '+(Y+H).toFixed(1)+' '+(X+rr).toFixed(1)+' '+(Y+H).toFixed(1)+'H'+(X+B-rr).toFixed(1)+'Q'+(X+B).toFixed(1)+' '+(Y+H).toFixed(1)+' '+(X+B).toFixed(1)+' '+(Y+H-rr).toFixed(1)+'V'+Y.toFixed(1)+'Z"/>';
      if(v===maxV && v>0) s += '<text class="c-ink" x="'+(x+bw/2).toFixed(1)+'" y="'+(y1-5).toFixed(1)+'" font-size="12" font-weight="600" text-anchor="middle">'+fmt(v)+'</text>';
      if(v===minV && v<0) s += '<text class="c-ink" x="'+(x+bw/2).toFixed(1)+'" y="'+(y2+14).toFixed(1)+'" font-size="12" font-weight="600" text-anchor="middle">'+fmt(v)+'</text>';
    }
    s += '<text class="c-muted" x="'+(x+bw/2).toFixed(1)+'" y="140" font-size="12" text-anchor="middle">'+parse(days[i]).getDate()+'</text>';
  });
  return s+'</svg>';
}
function safeMonthly(list){

  return {nets:nets, monthly:Math.max(0, percentile(nets, 0.25)*4)};
}

function loadExample(){
  var seed = 7; function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  var p = paramsNow(), type = curType(), srcs = state.settings.sources, i, d, wd;
  for(i=34;i>=1;i--){
    d = addDays(new Date(), -i); wd = d.getDay();
    if(wd===0 && rnd()<0.6) continue; if(rnd()<0.12) continue;
    var busy = (wd===5||wd===6||wd===0) ? 1.2 : 0.95, hours = Math.round((type==='vehicle' ? 7+rnd()*4 : 4+rnd()*4)*2)/2;
    var scale = type==='vehicle' ? 1 : (type==='service' ? 1.6 : 1.4), apps = {}, gross = 0;
    srcs.forEach(function(s, k){
      var amt = 0;
      if(k===0) amt = (450+rnd()*500)*busy*scale; else if(k===1) amt = (200+rnd()*400)*busy*scale; else if(k===2 && rnd()<0.5) amt = rnd()*300*scale;
      amt = Math.round(amt/10)*10; apps[s.id] = amt; gross += amt;
    });
    var e = {apps:apps, hours:hours, km:0, jobs:Math.max(1, Math.round(gross/(type==='service'?450:600))), fuelActual:null, materials:0, travel:0, platform:0, other:0, p:p, example:true};
    if(type==='vehicle'){ e.km = Math.round((70+rnd()*60)*(hours/9)); e.other = rnd()<0.3 ? 30 : 0; }
    else if(type==='service'){ e.materials = Math.round(gross*0.18/10)*10; e.travel = rnd()<0.5 ? 60 : 0; }
    else if(type==='online'){ e.platform = Math.round(gross*0.12/10)*10; e.other = 40; }
    else { e.materials = Math.round(gross*0.2/10)*10; e.travel = rnd()<0.4 ? 50 : 0; }
    state.entries[ymd(d)] = e;
  }
  save(); updateBanner();
}

function updatePricing(){

  var time = hrs*hourly, share = jobs>0 ? fixed/jobs : 0, base = mat+trv+time+share, minP = base/(1-(fee+mar)/100);
  var feeMar = minP - base;
  var html = '<div class="hero"><div class="small">'+esc(t('pr_minPrice'))+'</div><div class="big">'+fmt(minP)+'</div>'+BRUSH+'</div>';
  html += '<div class="card"><h2>'+esc(t('pr_made'))+'</h2><table class="table"><tbody>'+

    html += '<div class="card"><p class="verdict" style="margin-top:0">'+esc(cur>=minP ? t('pr_above') : t('pr_below'))+'</p>';

    else {

  html += '<div class="card"><h2>'+esc(t('themeTitle'))+'</h2><div class="seg" id="themeSeg">'+['auto','light','dark'].map(function(m){ return '<button type="button" data-th="'+m+'" aria-pressed="'+((state.theme||'auto')===m)+'">'+esc(t('theme'+m.charAt(0).toUpperCase()+m.slice(1)))+'</button>'; }).join('')+'</div></div>';
  html += '<div class="card"><h2>'+icon('lock',20)+esc(t('pinTitle'))+'</h2><p class="hint" style="margin:0 0 10px">'+esc(t('pinNote'))+'</p>'+
    (state.pin ? '<button type="button" class="btn ghost block" id="pinRm">'+esc(t('pinRemove'))+'</button>' : '<div class="srcrow"><input type="password" inputmode="numeric" maxlength="4" id="pin-new" placeholder="••••" aria-label="'+esc(t('pinSet'))+'"><button type="button" class="btn small" id="pinSetBtn">'+icon('lock',20)+esc(t('pinSet'))+'</button></div>')+'</div>';
  html += '<div class="card"><h2>'+esc(t('feedback'))+'</h2><label for="s-fb">'+esc(t('feedbackQ'))+'</label><textarea id="s-fb"></textarea><div style="height:10px"></div><a class="btn wa block" id="fbSend" href="#" target="_blank" rel="noopener">'+icon('send',20)+esc(t('sendFeedback'))+'</a></div>';
  html += '<button type="button" class="btn danger block" id="wipe">'+esc(t('clearAll'))+'</button>';
  v.innerHTML = html; bindBack(v); segInit(v);

  $('s-name').addEventListener('input', function(){ state.name = this.value; save(); });
  $('s-type').addEventListener('change', function(){ setType(this.value, false); resetToday(); renderSettings(); });
  v.querySelectorAll('#srcList input[data-i]').forEach(function(el){ el.addEventListener('input', function(){ s.sources[+this.getAttribute('data-i')].name = this.value; save(); }); });
  v.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click', function(){ var i = +this.getAttribute('data-rm'); var x = s.sources[i]; state.oldNames[x.id] = x.name; s.sources.splice(i,1); save(); rebuildToday(); renderSettings(); }); });
  function addSource(name){
    name = (name||'').trim(); if(!name || s.sources.length>=10) return;
    var id = 'c'+Date.now().toString(36)+Math.floor(Math.random()*100); s.sources.push({id:id, name:name}); save(); rebuildToday(); renderSettings();
  }
  v.querySelectorAll('[data-m]').forEach(function(c){ c.addEventListener('change', function(){ var x = s.sources[+this.getAttribute('data-m')]; x.m = this.checked; save(); rebuildToday(); renderSettings(); }); });
  v.querySelectorAll('[data-mamt]').forEach(function(c){ c.addEventListener('input', function(){ s.sources[+this.getAttribute('data-mamt')].mAmt = this.value; save(); }); });
  v.querySelectorAll('[data-mg]').forEach(function(c){ c.addEventListener('input', function(){ s.sources[+this.getAttribute('data-mg')].mg = this.value; save(); }); });
  var fa = $('s-fixedamt'), fp = $('s-fixedper');
  function fixedChanged(){ s.fixedAmt = fa.value; s.fixedPer = fp.value; recomputeFixed(); save(); }
  fa.addEventListener('input', fixedChanged); fp.addEventListener('change', fixedChanged);
  $('addSrc').addEventListener('click', function(){ addSource($('s-new').value); });
  v.querySelectorAll('[data-q]').forEach(function(b){ b.addEventListener('click', function(){ addSource(this.getAttribute('data-q')); }); });
  var sv = $('s-veh'); if(sv) sv.addEventListener('change', function(){ var k = this.value, pr = PRESETS[k]; s.vehicle = k; s.mode = pr.mode; s.wear = pr.wear; if(pr.mode==='perKm'){ s.rate = pr.rate; } else { s.mileage = pr.mileage; s.price = pr.price; } save(); renderSettings(); });
  [['s-rate','rate'],['s-mileage','mileage'],['s-price','price'],['s-wear','wear'],['s-days','workDays'],['s-target','target'],['s-margin','margin']].forEach(function(pair){ var el = $(pair[0]); if(el) el.addEventListener('input', function(){ s[pair[1]] = num(this.value); save(); }); });
  $('sendBackup').addEventListener('click', sendBackup);
  $('copyBackup').addEventListener('click', function(){ state.lastBackup = todayStr(); save(); copyText(backupCode()); });
  var cd = $('csvDl'); if(cd) cd.addEventListener('click', csvDownload);
  v.querySelectorAll('[data-th]').forEach(function(b){ b.addEventListener('click', function(){ state.theme = this.getAttribute('data-th'); save(); applyTheme(); renderSettings(); }); });
  var pr = $('pinRm'); if(pr) pr.addEventListener('click', function(){ state.pin = ''; save(); renderSettings(); });
  var ps = $('pinSetBtn'); if(ps) ps.addEventListener('click', function(){ var p = $('pin-new').value; if(!/^\d{4}$/.test(p)){ toast(t('pinBad')); return; } state.pin = pinHash(p); save(); toast(t('pinSaved')); renderSettings(); });
  $('doRestore').addEventListener('click', function(){
    try{
      var obj = JSON.parse(decodeURIComponent(escape(atob($('s-code').value.trim()))));
      if(!obj || typeof obj!=='object' || !obj.entries || !obj.settings) throw new Error('bad');
      state = Object.assign(defaults(), obj); state.settings = Object.assign(defaults().settings, obj.settings); state.pricing = Object.assign(defaults().pricing, obj.pricing||{}); if(!Array.isArray(state.dues)) state.dues = [];
      if(!state.settings.sources || !state.settings.sources.length) state.settings.sources = defaultSources(state.settings.type);
      save(); toast(t('restored')); applyLang(); renderSettings(); updateBanner();
    }catch(e){ toast(t('badCode')); }
  });
  function fbLink(){ $('fbSend').href = 'https://wa.me/'+FEEDBACK_NUMBER+'?text='+encodeURIComponent('Take-Home Tracker feedback:\n'+$('s-fb').value); }
  fbLink(); $('s-fb').addEventListener('input', fbLink);
  var armed = false, wipe = $('wipe');
  wipe.addEventListener('click', function(){
    if(!armed){ armed = true; wipe.textContent = t('sure'); setTimeout(function(){ armed = false; wipe.textContent = t('clearAll'); }, 4000); return; }
    var lang = state.lang; state = defaults(); state.lang = lang; state.settings.sources = defaultSources(state.settings.type); save(); toast(t('cleared')); updateBanner(); resetToday(); renderSettings();
  });
}

/* ---------- Navigation ---------- */
var current = 'today';
function show(view){
  current = view;
  ['today','summary','statement','dues','pricing','more','learn','settings'].forEach(function(k){ $('v-'+k).hidden = (k!==view); });
  var tabView = view==='statement' ? 'summary' : ((view==='learn' || view==='settings') ? 'more' : view);
  document.querySelectorAll('nav.tabs button').forEach(function(b){ if(b.getAttribute('data-view')===tabView) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  renderCurrent(); window.scrollTo(0,0);
}
function renderCurrent(){
  if(current==='summary') renderSummary(); else if(current==='statement') renderStatement(); else if(current==='pricing') renderPricing();
  else if(current==='learn') renderLearn(); else if(current==='settings') renderSettings(); else if(current==='dues') renderDues(); else if(current==='more') renderMore();
}

/* ---------- Wire up ---------- */
$('d-date').value = todayStr();
$('d-date').addEventListener('change', fillToday);
$('saveDay').addEventListener('click', saveDay);
$('delDay').addEventListener('click', deleteDay);
$('offBtn').addEventListener('click', function(){ var b = $('offBox'); b.hidden = !b.hidden; if(!b.hidden && b.scrollIntoView) b.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block:'center'}); });
$('clearExample').addEventListener('click', function(){ removeExamples(); save(); updateBanner(); renderCurrent(); fillToday(); toast(t('examplesRemoved')); });
document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ state.lang = this.getAttribute('data-lang'); save(); applyLang(); }); });
document.querySelectorAll('nav.tabs button').forEach(function(b){ b.addEventListener('click', function(){ show(this.getAttribute('data-view')); }); });

function pinHash(p){ var h = 5381, x = 'tht'+p; for(var i=0;i<x.length;i++){ h = ((h<<5)+h+x.charCodeAt(i))|0; } return String(h); }
function showLock(){
  if(!state.pin) return;
  var o = document.createElement('div'); o.id = 'lock'; o.className = 'lock'; o.setAttribute('role','dialog'); o.setAttribute('aria-label', t('pinEnter'));
  var keys = ''; ['1','2','3','4','5','6','7','8','9','','0','x'].forEach(function(k){
    if(k==='') keys += '<button type="button" class="nokey" tabindex="-1" aria-hidden="true"></button>';
    else if(k==='x') keys += '<button type="button" data-k="x" aria-label="'+esc(t('back'))+'">'+icon('del',28)+'</button>';
    else keys += '<button type="button" data-k="'+k+'">'+k+'</button>';
  });
  o.innerHTML = '<div class="lockin"><h2>'+icon('lock',24)+esc(t('pinEnter'))+'</h2><div class="dots" id="lock-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="hint" id="lock-err" role="alert" style="min-height:24px;color:var(--loss-text)"></p><div class="pad">'+keys+'</div><p class="hint">'+esc(t('pinForgot'))+'</p></div>';
  document.body.appendChild(o);
  var buf = '';
  function draw(){ o.querySelectorAll('#lock-dots i').forEach(function(d, i){ d.classList.toggle('on', i<buf.length); }); }
  function press(k){
    if(k==='x') buf = buf.slice(0,-1); else if(buf.length<4) buf += k;
    $('lock-err').textContent = ''; draw();
    if(buf.length===4){
      if(pinHash(buf)===state.pin){ document.removeEventListener('keydown', onKey); o.remove(); }
      else { $('lock-err').textContent = t('pinWrong'); var dd = $('lock-dots'); dd.classList.remove('shake'); void dd.offsetWidth; dd.classList.add('shake'); buf = ''; setTimeout(draw, 250); }
    }
  }
  function onKey(e){ if(/^\d$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('x'); }
  document.addEventListener('keydown', onKey);
  o.querySelectorAll('[data-k]').forEach(function(b){ b.addEventListener('click', function(){ press(this.getAttribute('data-k')); }); });
}
applyTheme(); fillIcons(); buildToday(); applyLang(); updateBanner(); showLock(); rupeeify();
})();
</script>
